[project]
name = "aisc-backend"
version = "0.3.0"
description = "Backend for AISC"
authors = [
    { name = "Thibault Simonetto", email = "thibault.simonetto@uni.lu" },
    { name = "Maxime Cordy", email = "maxime.cordy@uni.lu" },
    { name = "Sean Blevins", email = "sean.blevins@uni.lu" },
]
maintainers = [
    { name = "Université du Luxembourg" },
    { name = "Luxembourg Institute of Science and Technology (LIST)" },
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3==1.42.7",
    "celery[redis]>=5.6.3",
    "django>=5.2.7,<6",
    "django-allauth[headless-spec]>=65.19.4",
    "django-cors-headers>=4.9.0",
    "django-ninja>=1.7.1",
    "django-ninja-jwt>=5.4.5",
    "environs>=15.2.0",
    "pandas>=3.0.6",
    "psycopg[binary]>=3.3.6",
    "pyarrow>=25.0.1",
    "uvicorn>=0.53.0",
    "whitenoise>=6.12.0",
    "jsonschema>=4.26.0",
    "cryptography>=50.0.1",
    "aisc-plugin-manager>=0.3.0",
    "aisc-plugin-interface>=0.4.0",
    "aisc-identity>=0.1.0",
    "httpx>=0.28.1",
    "immudb-py>=1.5.0",
]

[tool.uv.sources]
# our 0.4.0, built from shared/plugin-interface by the root's scripts/vendor-plugin-interface.sh: PyPI's latest, 0.3.0, has no assesses, helpers or connections
aisc-plugin-interface = { path = "vendor/aisc_plugin_interface-0.4.0-py3-none-any.whl" }
# this checkout's plugin-manager and aisc_identity, built by the same script, so an image built from the
# Dockerfile alone holds them (upstream's tag v0.3.0 lacks the local plugin-manager commits)
aisc-plugin-manager = { path = "vendor/aisc_plugin_manager-0.3.0-py3-none-any.whl" }
aisc-identity = { path = "vendor/aisc_identity-0.1.0-py3-none-any.whl" }
