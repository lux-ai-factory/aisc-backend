[project]
name = "aisc-backend"
version = "0.2.4"
description = "Backend for AISC"
authors = [
    { name = "Thibault Simonetto", email = "thibault.simonetto@uni.lu" },
    { name = "Maxime Cordy", email = "maxime.cordy@uni.lu" },
    { name = "Sean Blevins", email = "sean.blevins@uni.lu" },
]
maintainers = [
    { name = "Université du Luxembourg" },
    { name = "Luxembourg Institute of Science and Technology (LIST)" },
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3==1.43.100",
    "celery[redis]>=5.6.0",
    "django==6.1.1",
    "django-allauth[headless-spec]==65.19.4",
    "django-cors-headers>=4.9.0",
    "django-ninja>=1.4.5",
    "django-ninja-jwt==5.4.5",
    "environs==15.2.0",
    "pandas==3.0.6",
    "psycopg[binary]==3.3.6",
    "pyarrow==25.0.1",
    "uvicorn==0.53.0",
    "whitenoise>=6.11.0",
    "jsonschema>=4.25.1",
    "cryptography==50.0.1",
    "aisc-plugin-manager>=0.2.7",
    "aisc-plugin-interface>=0.2.6",
    "httpx>=0.28.1",
    "immudb-py>=1.5.0",
]

[tool.uv.sources]
#aisc-plugin-manager = { git = "https://github.com/lux-ai-factory/aisc-plugin-manager", tag = "v0.2.7" }
aisc-plugin-manager = { path = "../../shared/plugin-manager", editable = true }
aisc-plugin-interface = { path = "../../shared/plugin-interface", editable = true }

